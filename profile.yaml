# 判定対象となる人物のプロファイル(いまは1件)。
#
# Jev は、この profile の文章を読んで「この電文はこの人にとって何を意味するか」を
# 判断します。仮に東京都内に住む会社員を想定して書いてあります。
# ご自身の状況に合わせて、下の各項目を書き換えてください。
#
# 将来、複数人(ペルソナ40人や拠点40件)に拡張する予定です(requirements.md の R-70)。

id: person-001

# 表示に使う名前。ニックネームでかまいません。
name: 田中さん

# 気象庁の市町村コード。保存済みの警報XML(Body/Warning/Item/Area/Code)にある実在の値です。
# 東京都の例:
#   1310100 千代田区 / 1310300 港区 / 1310400 新宿区 / 1311100 大田区
#   1311200 世田谷区 / 1311500 杉並区 / 1320100 八王子市
# 府県予報区は 130000(東京都)、一次細分区域は 130010(東京地方)、
# 市町村等をまとめた地域は 130011(２３区西部)。
# ご自身の市区町村のコードに書き換えてください。
area_code: "1311200"

# 都道府県と市区町村。area_code と揃えてください。
pref: 東京都
city: 世田谷区

# だいたいの緯度経度(世田谷区役所付近)。将来、交通量データの重ね合わせに使います。
lat: 35.6465
lon: 139.6530

# ここが判定の中心になります。Jev はこの文章を読んで判断するので、
# 暮らし・仕事・移動・住まい・家族など、判断に効く事情を自由に書いてください。
# 箇条書きでも文章でもかまいません。長さの制限はありません。
profile: |
  東京都世田谷区に住む38歳の会社員。妻と小学生の子ども1人の3人暮らし。
  住まいは木造2階建ての戸建てで、近くに小さな川がある。ハザードマップでは
  浸水想定は浅いが、大雨のときは道路が冠水することがある。

  勤務先は千代田区のオフィスで、平日は小田急線と地下鉄で通勤している。
  週に2日は在宅勤務ができるが、会議の都合で出社が必要な日もある。
  自家用車はあるが普段はあまり使わず、買い物は自転車か徒歩。

  子どもは区立小学校に通っていて、警報が出ると休校や引き取りの連絡がくる。
  高齢の両親が神奈川県横浜市に2人で暮らしていて、台風のときは電話で様子を確認している。

  9月20日〜21日の連休は、家族で日帰りの外出を予定している(まだ中止の判断はしていない)。
  非常用の水と食料は1日分くらいしか備蓄がなく、モバイルバッテリーは充電していない。
