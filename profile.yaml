# 公開用の仮プロファイル(デモ用)。
#
# このリポジトリは public です。**このファイルに個人情報を書かないでください。**
# 自分の実際の状況で試したい場合は、profile.local.yaml を作ってください
# (.gitignore に入れてあるのでコミットされません)。書き方は
# profile.local.example.yaml を見てください。
#
# Jev は、この profile の文章を読んで「この電文はこの人にとって何を意味するか」を
# 判断します。以下は東京都に住む会社員を想定した、架空の内容です。

id: person-demo

# 画面に出る表示名。
name: shnch3211さん

# 気象庁の地域コード。ここでは**東京都の府県予報区コード**を使っています。
# 市区町村コード(世田谷区 1311200 など)まで書くと住んでいる場所が絞られるため、
# 公開用では予報区にとどめています。判定の質はほぼ変わらないことを確認済みです
# (requirements.md の「公開の方針」を参照)。
#
# 予報区コードの例: 130000 東京都 / 140000 神奈川県 / 120000 千葉県 / 110000 埼玉県
area_code: "130000"

# 都道府県。市区町村は公開用では空にしています。
pref: 東京都
city: ""

# 東京都のおおよその位置(都庁付近)。将来、交通量データの重ね合わせに使います。
lat: 35.6896
lon: 139.6917

# ここが判定の中心になります。Jev はこの文章を読んで判断します。
# 公開用なので、特定の市区町村や住所に寄らない書き方にしています。
profile: |
  東京都に住む38歳の会社員。妻と小学生の子ども1人の3人暮らし。
  住まいは木造2階建ての戸建てで、近くに小さな川がある。ハザードマップでは
  浸水想定は浅いが、大雨のときは道路が冠水することがある。

  勤務先は都心のオフィスで、平日は私鉄と地下鉄を乗り継いで通勤している。
  週に2日は在宅勤務ができるが、会議の都合で出社が必要な日もある。
  自家用車はあるが普段はあまり使わず、買い物は自転車か徒歩。

  子どもは区立小学校に通っていて、警報が出ると休校や引き取りの連絡がくる。
  高齢の両親が神奈川県内で2人暮らしをしていて、台風のときは電話で様子を確認している。

  連休は家族で日帰りの外出を予定している(まだ中止の判断はしていない)。
  非常用の水と食料は1日分くらいしか備蓄がなく、モバイルバッテリーは充電していない。
