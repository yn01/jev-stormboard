# profile.local.yaml の書き方の例。
#
# このファイルをコピーして profile.local.yaml という名前で保存し、
# 自分の実際の状況に書き換えてください。
#
#     cp profile.local.example.yaml profile.local.yaml
#
# profile.local.yaml があれば、アプリはそちらを優先して読みます。
# .gitignore に入れてあるので、コミットされることはありません。
# (このファイル自体は例なので、仮の内容にしてあります)
#
# 注意: 画面には name がそのまま表示されます。スクリーンショットを撮ったり
# 画面を録画したりする場合は、表示名に気をつけてください。

id: person-local

# 画面に出る表示名。実名を出したくない場合はニックネームを使ってください。
name: わたし

# 気象庁の地域コード。細かくするほど判定は具体的になります。
#   府県予報区   : 130000(東京都) / 140000(神奈川県) など
#   一次細分区域 : 130010(東京地方) など
#   市区町村     : 1311200(世田谷区) / 1310400(新宿区) など
# 正確な値は、保存済みの警報XML(Body/Warning/Item/Area/Code)で確認できます。
area_code: "1311200"

pref: 東京都
city: 世田谷区

# おおよその緯度経度。番地まで書く必要はありません。
lat: 35.6465
lon: 139.6530

# ここが判定の中心です。暮らし・仕事・移動・住まい・家族など、
# 判断に効く事情を自由に書いてください。箇条書きでも文章でもかまいません。
profile: |
  東京都世田谷区に住む会社員。家族と3人暮らし。
  木造2階建ての戸建てで、近くに川がある。大雨のときは道路が冠水することがある。

  平日は電車で都心へ通勤。週に2日は在宅勤務ができる。
  子どもは小学校に通っていて、警報が出ると休校や引き取りの連絡がくる。
  高齢の両親が離れて暮らしていて、台風のときは電話で様子を確認している。

  今週末は日帰りの外出を予定している。
  非常用の備蓄は1日分ほど。モバイルバッテリーは充電していない。
